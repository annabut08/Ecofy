apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecofy-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ecofy-backend
  template:
    metadata:
      labels:
        app: ecofy-backend
    spec:
      containers:
        - name: ecofy-backend
          image: ecofy-backend:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
